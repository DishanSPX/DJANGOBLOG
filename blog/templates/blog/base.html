{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}DjangoBlog{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="{% url 'home' %}">DjangoBlog</a>
    <div>
      <a class="nav-link d-inline text-white" href="{% url 'home' %}">Home</a>
      <a class="nav-link d-inline text-white" href="{% url 'about' %}">About</a>
      <a class="nav-link d-inline text-white" href="{% url 'contact' %}">Contact</a>
    </div>
  </nav>
  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
