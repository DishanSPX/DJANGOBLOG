{% extends "blog/base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
  <h1>Welcome to DjangoBlog</h1>
  {% for post in posts %}
    <h2>{{ post.title }}</h2>
    <p>{{ post.content }}</p>
    <hr>
  {% empty %}
    <p>No posts yet. Add one in /admin/.</p>
  {% endfor %}
{% endblock %}
